<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A11"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Outer Hex Shield Cyan/Blue Gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>

    <!-- Cube Top Face -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Cube Left Face -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Cube Right Face -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Outer Hexagonal Frame Shield -->
  <g filter="url(#cyanGlow)">
    <path d="M 256 64 L 436 168 L 436 376 L 256 480 L 76 376 L 76 168 Z" fill="none" stroke="url(#hexGrad)" stroke-width="28" stroke-linejoin="round"/>
  </g>

  <!-- Inner Isometric Cube -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Top Face -->
    <path d="M 0 -85 L 75 -42 L 0 0 L -75 -42 Z" fill="url(#topFace)"/>

    <!-- Left Face -->
    <path d="M -75 -42 L 0 0 L 0 85 L -75 42 Z" fill="url(#leftFace)"/>

    <!-- Right Face -->
    <path d="M 0 0 L 75 -42 L 75 42 L 0 85 Z" fill="url(#rightFace)"/>

    <!-- Inner Cube Stroke Highlights -->
    <path d="M 0 -85 L 75 -42 L 75 42 L 0 85 L -75 42 L -75 -42 Z" fill="none" stroke="#070A11" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 0 0 L 0 85 M 0 0 L -75 -42 M 0 0 L 75 -42" stroke="#070A11" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
