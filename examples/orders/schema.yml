version: 2

models:
  - name: fct_orders
    description: Canonical analytics model for customer orders. Generated by DataHub dbt Forge.
    columns:
      - name: order_id
        description: Unique identifier for each transaction order.
        data_type: NUMBER
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Unique reference to purchasing customer.
        data_type: NUMBER
        tests:
          - not_null
      - name: order_value
        description: Calculated gross order value (quantity * unit_price).
        data_type: DECIMAL
        tests:
          - not_null
