version: 2

models:
  - name: monthly_revenue
    description: Monthly aggregated net revenue cohort model. Generated by DataHub dbt Forge.
    columns:
      - name: revenue_month
        description: Cohort truncated transaction month.
        data_type: TIMESTAMP
        tests:
          - not_null
      - name: net_revenue
        description: Calculated net monetary revenue (gross - discounts).
        data_type: DECIMAL
        tests:
          - not_null
